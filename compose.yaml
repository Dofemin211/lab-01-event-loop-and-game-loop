services:
  dogfight:
    image: ${IMAGE_NAME:-dogfight}:${IMAGE_TAG:-local}
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
        GIT_SHA: ${GIT_SHA:-local}
    environment:
      NODE_ENV: production
      PORT: '8080'
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set ALLOWED_ORIGINS to the exact public HTTPS origin}
      TRUSTED_PROXY_IPS: 172.30.0.2
      MAX_CONNECTIONS_PER_IP: ${MAX_CONNECTIONS_PER_IP:-100}
      MAX_ROOMS: ${MAX_ROOMS:-50}
      MAX_PLAYERS_PER_ROOM: ${MAX_PLAYERS_PER_ROOM:-8}
      LOG_DIR: /data/logs
    volumes:
      - match-logs:/data/logs
    expose:
      - '8080'
    restart: unless-stopped
    stop_grace_period: 15s
    mem_limit: 512m
    cpus: 1.0
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      game-net:
        ipv4_address: 172.30.0.3
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3

  proxy:
    image: caddy:2.11.9-alpine@sha256:0bbb055bda6793c999bde78b1b5ce3e89f829fb031af2cf50056ea1246559fee
    depends_on:
      dogfight:
        condition: service_healthy
    ports:
      - '${HTTP_BIND_PORT:-8081}:${CADDY_HTTP_PORT:-8081}'
      - '${HTTPS_BIND_PORT:-8443}:${CADDY_HTTPS_PORT:-8443}'
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to the public hostname}
      CADDY_HTTP_PORT: ${CADDY_HTTP_PORT:-8081}
      CADDY_HTTPS_PORT: ${CADDY_HTTPS_PORT:-8443}
      HTTPS_URL: ${HTTPS_URL:?Set HTTPS_URL to the public HTTPS origin}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    networks:
      game-net:
        ipv4_address: 172.30.0.2

volumes:
  match-logs:
  caddy-data:
  caddy-config:

networks:
  game-net:
    ipam:
      config:
        - subnet: 172.30.0.0/29
