name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    container:
      # Keep the browser binaries in sync with @playwright/test in package-lock.json.
      image: mcr.microsoft.com/playwright:v1.65.0-noble
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:tools
      - run: npm run lint
      - run: npm test
      - run: npm run coverage
      - run: npm run build
      - run: npm run e2e
